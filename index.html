<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>والیبال هفتگی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Vazirmatn', sans-serif; background: #1a1a2e; color: #fff; min-height: 100vh; user-select: none; }
  #live-alert { position: fixed; top: 0; width: 100%; background: #f59e0b; color: #000; text-align: center; padding: 10px; font-weight: bold; z-index: 10000; transform: translateY(-100%); transition: transform 0.3s; }
  #live-alert.show { transform: translateY(0); }
  
  .court-board { width: 100%; max-width: 400px; height: 380px; margin: 20px auto; background: #e69138; border: 4px solid #fff; display: flex; flex-direction: column; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
  .pos-zone { flex: 1; border: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: center; align-items: center; position: relative; }
  .bench-zone { background: rgba(0,0,0,0.2); padding: 15px; min-height: 80px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  
  /* انیمیشن نرم حرکت مهره‌ها */
  .tactic-player { 
    display: flex; flex-direction: column; align-items: center; cursor: grab; 
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .shirt-icon { width: 38px; height: 38px; pointer-events: none; }
  .t-name { font-size: 10px; background: rgba(0,0,0,0.7); padding: 2px; border-radius: 4px; pointer-events: none; }
</style>
</head>
<body>

<div id="live-alert">⚠️ یک نفر دیگر در حال تغییر ترکیب است...</div>

<div class="court-board">
    <div style="display:flex; flex-direction:column; flex:1">
        <div style="display:flex; flex:1"><div class="pos-zone drop-zone" data-zone="B1"></div><div class="pos-zone drop-zone" data-zone="B6"></div><div class="pos-zone drop-zone" data-zone="B5"></div></div>
        <div style="display:flex; flex:1"><div class="pos-zone drop-zone" data-zone="B2"></div><div class="pos-zone drop-zone" data-zone="B3"></div><div class="pos-zone drop-zone" data-zone="B4"></div></div>
    </div>
    <div style="height:6px; background:#fff"></div>
    <div style="display:flex; flex-direction:column; flex:1">
        <div style="display:flex; flex:1"><div class="pos-zone drop-zone" data-zone="A4"></div><div class="pos-zone drop-zone" data-zone="A3"></div><div class="pos-zone drop-zone" data-zone="A2"></div></div>
        <div style="display:flex; flex:1"><div class="pos-zone drop-zone" data-zone="A5"></div><div class="pos-zone drop-zone" data-zone="A6"></div><div class="pos-zone drop-zone" data-zone="A1"></div></div>
    </div>
</div>

<div class="bench-zone drop-zone" data-zone="bench" id="court-bench"></div>

<script>
const BIN_ID = '6a25982dda38895dfe9569f8'; 
const API_KEY = '$2a$10$.bXtjVvetitLx4DUvxkqWu3zvWmYEvL13hkjtqR5Qwg1eqLyaIt7.'; 
let state = { players: [], attendance: {}, lastEdit: 0 };
const TEAM_COLORS = { A: '#e94560', B: '#007bff', null: '#888' };
let activeDragId = null;

async function save() {
    state.lastEdit = Date.now();
    await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
        body: JSON.stringify(state)
    });
}

async function load() {
    if (activeDragId) return; 
    const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: { 'X-Master-Key': API_KEY } });
    const data = await res.json();
    if (data.record.lastEdit > state.lastEdit) {
        state = data.record;
        document.getElementById('live-alert').classList.add('show');
        setTimeout(() => document.getElementById('live-alert').classList.remove('show'), 3000);
        render();
    }
}

function handleDrop(playerId, zoneId) {
    const p = state.players.find(x => x.id === playerId);
    if(p) {
        p.zone = zoneId;
        render(); // اول رندر سریع
        save();   // بعد ذخیره در پس‌زمینه
    }
}

function render() {
    if (activeDragId) return;
    document.querySelectorAll('.tactic-player').forEach(el => el.remove());
    state.players.forEach(p => {
        let color = p.zone.startsWith('A') ? TEAM_COLORS.A : (p.zone.startsWith('B') ? TEAM_COLORS.B : TEAM_COLORS.null);
        const el = document.createElement('div');
        el.className = 'tactic-player';
        el.innerHTML = `<svg class="shirt-icon" viewBox="0 0 24 24" fill="${color}"><path d="M20 6L16 3H8L4 6L2 11L6 13V21H18V13L22 11L20 6Z"/></svg><div class="t-name">${p.name}</div>`;
        
        let zone = document.querySelector(`[data-zone="${p.zone}"]`);
        (zone || document.getElementById('court-bench')).appendChild(el);
        
        el.draggable = true;
        el.ondragstart = (e) => { activeDragId = p.id; e.dataTransfer.setData('text/plain', p.id); };
        el.ondragend = () => { activeDragId = null; render(); };
    });
}

document.querySelectorAll('.drop-zone').forEach(z => {
    z.ondragover = (e) => e.preventDefault();
    z.ondrop = (e) => {
        const id = e.dataTransfer.getData('text/plain');
        handleDrop(id, z.dataset.zone);
    };
});

setInterval(load, 2000);
load();
</script>
</body>
</html>
